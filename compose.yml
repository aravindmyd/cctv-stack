# The deployment boundary (AGENTS.md §3).
#
# Seven services: a broker, a config generator, Frigate, the clip-worker, the uploader,
# cleanup, and the read-only status collector. The generator is a *service* rather than a step
# in `install.sh` so that installing never needs Python on the host — the image that generates
# the config is the same image that runs from it, so the two cannot disagree about what a
# valid config is.
#
# Deliberate omissions, recorded so they read as decisions rather than oversights:
#
#   * **Port 5000 is never published.** Frigate resolves requests arriving on it as
#     anonymous admin (integration contract §2). Publishing it would turn the whole stack
#     into a remote admin bypass, and `auth.enabled: false` below is only safe *because* it
#     is not published.
#   * **The broker is not published either.** Nothing outside the compose network needs it,
#     and an open broker on the LAN is how a camera feed ends up on someone else's dashboard.

name: cctv-stack

x-cctv-image: &cctv-image
  image: ${CCTV_IMAGE:-cctv-stack:local}
  build:
    context: .

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ${CCTV_DATA_DIR:-./data}/mosquitto:/mosquitto/data

  # Runs once, writes Frigate's config from config/cameras.yml, and exits. Frigate waits for
  # it (INV-3: camera configuration exists in one place, everything else is generated).
  config:
    <<: *cctv-image
    restart: "no"
    command:
      - cctv-config
      - generate
      - --cameras
      - /config/cameras.yml
      - --out
      - /frigate/config.yml
    env_file: [.env]
    volumes:
      # Read-only: this service reads our config and writes Frigate's. It has no business
      # modifying the single source of truth, and a read-only mount makes that structural.
      - ./config:/config:ro
      - ./config/frigate:/frigate

  frigate:
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:stable}
    restart: unless-stopped
    # Docker's 64 MB default is the classic Frigate failure: detection works, then stops,
    # with no error that points at shared memory.
    shm_size: ${FRIGATE_SHM_SIZE:-256mb}
    # Frigate needs time to close its recording segments. Killing it at the default 10 s
    # loses the tail of the last segment, which is footage we then cannot fetch (INV-9).
    stop_grace_period: 30s
    depends_on:
      config:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    tmpfs:
      - /tmp/cache
    ports:
      # Loopback only. The UI is for the operator standing at the machine.
      - "127.0.0.1:${FRIGATE_UI_PORT:-8971}:8971"
    volumes:
      - ./config/frigate:/config
      - ${CCTV_DATA_DIR:-./data}/media:/media/frigate
    environment:
      # Should match `site.timezone` in config/cameras.yml. Frigate uses this for its own
      # presentation; our clip paths are derived from the config, not from here (ADR-0017).
      TZ: ${TZ:-Asia/Kolkata}

  clip-worker:
    <<: *cctv-image
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_started
      mosquitto:
        condition: service_started
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      # Named explicitly because this database is the *only* coordination between services
      # (contract §1). Both writers must agree on it, and an implicit default that later
      # changed would silently split the system in two.
      CCTV_DB: /data/cctv.db
      CCTV_FRIGATE_URL: http://frigate:5000
      CCTV_MQTT_HOST: mosquitto
      CCTV_MQTT_PORT: "1883"
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data

  # Turns canonical clips into durable cloud objects, exactly once (M3, LLD 04).
  #
  # It reads `clips/` **read-only**: the uploader has no business modifying or deleting a
  # clip, and a bug that unlinked the only local copy of an un-uploaded clip would violate
  # INV-1 at the worst possible moment. The nested mount is what makes that structural — the
  # more specific path wins, so `/data` being writable (the database lives there) does not
  # hand it write access to `/data/clips`.
  uploader:
    <<: *cctv-image
    # `on-failure:5`, not `unless-stopped`. A half-finished `.env` (a bucket with no key)
    # should produce a visibly exited container with a specific message, not a restart storm
    # that hides the cause (service-contracts §7). A wrong *credential*, by contrast, does not
    # crash: it starts, reports UNHEALTHY, and names the fix.
    restart: on-failure:5
    command: ["cctv-uploader"]
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      CCTV_DB: /data/cctv.db
      CCTV_UPLOADER_HEALTH_PORT: "8082"
    ports:
      # Loopback only. The admin endpoints are additionally behind INTERNAL_API_TOKEN, and
      # nothing here is ever published to the LAN.
      - "127.0.0.1:${UPLOADER_HEALTH_PORT:-8082}:8082"
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data
      - ${CCTV_DATA_DIR:-./data}/clips:/data/clips:ro

  # Enforces local retention: a clip file is deleted only when its upload is
  # terminal-success (M4 J1, lld/05). This is the one component allowed to destroy data.
  #
  # Unlike the uploader, it needs `/data` **writable**, and its clips directory must therefore
  # NOT be mounted read-only — deleting is its job. What stops it deleting too much is not a
  # mount flag but the enumerated-state query and four further guards in `src/cctv/cleanup.py`,
  # each of which has a test. A read-only mount here would make the service useless while
  # looking safer.
  # Aggregate status: the one screen that answers "is my CCTV working?" (M5, lld/06). It is a
  # reader, not a writer of clips, so its footage mounts are read-only; the database is
  # writable because the storage projection keeps a small history of disk sizes.
  #
  # Published to the LAN on purpose, unlike the other health surfaces: it exposes camera names
  # and states, never credentials, and it mounts no admin route.
  status:
    <<: *cctv-image
    command: ["cctv-status"]
    restart: on-failure:5
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      CCTV_DB: /data/cctv.db
      CCTV_STATUS_HEALTH_PORT: "8084"
      # The monitoring tool's config is generated here, from cameras.yml (INV-3). It lives
      # under /data because that is the one tree the services are guaranteed to be able to
      # write: a bind mount of a not-yet-existing subdirectory is created root-owned, and the
      # image runs as uid 10001.
      CCTV_STATUS_GATUS_CONFIG: /data/gatus/config.yaml
      CCTV_STATUS_GATUS_URL: http://gatus:8080
      CCTV_STATUS_NTFY_URL: http://ntfy:80
    ports:
      - "${STATUS_PORT:-8084}:8084"
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data
      - ${CCTV_DATA_DIR:-./data}/clips:/data/clips:ro
      - ${CCTV_DATA_DIR:-./data}/media:/data/media:ro

  # Dashboard, history and alert delivery (lld/06 §6). We deliberately do not build either:
  # Gatus owns both, configured from the file `status` generates, and `ntfy` is the channel.
  # Gatus is in the default stack rather than a profile: a product whose promise is "health as
  # a first-class feature" should not ship with alerting switched off by default.
  gatus:
    image: ghcr.io/twin/gatus:stable
    restart: unless-stopped
    depends_on: [status]
    environment:
      GATUS_CONFIG_PATH: /data/gatus/config.yaml
    ports:
      - "${GATUS_PORT:-3001}:8080"
    volumes:
      # Read the generated config from the data tree, which the status service can write.
      # Gatus's own state goes in a named volume so it never needs to create a host
      # directory (that is what left a fresh install in a crash loop).
      - ${CCTV_DATA_DIR:-./data}:/data:ro
      - gatus-data:/gatus-data

  # Push notifications. Published to the LAN so a phone can subscribe, and it holds no camera
  # data — only the alert text Gatus sends it.
  ntfy:
    image: binwiederhier/ntfy
    command: ["serve"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://ntfy
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
    ports:
      - "${NTFY_PORT:-8085}:80"
    volumes:
      - ${CCTV_DATA_DIR:-./data}/ntfy:/var/cache/ntfy

  cleanup:
    <<: *cctv-image
    command: ["cctv-cleanup"]
    # Same reasoning as the uploader: a configuration error must end as a visibly exited
    # container with a specific message, not a restart storm that buries the cause.
    restart: on-failure:5
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      CCTV_DB: /data/cctv.db
      CCTV_CLEANUP_HEALTH_PORT: "8083"
    ports:
      # Loopback only. Nothing here is ever published to the LAN.
      - "127.0.0.1:${CLEANUP_HEALTH_PORT:-8083}:8083"
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data

  # One-shot operator commands (backup, restore). Kept out of `up` by a profile: nothing here
  # is long-running, and an accidental `up` must not start a backup at an arbitrary moment.
  backup:
    <<: *cctv-image
    profiles: ["ops"]
    restart: "no"
    command: ["cctv-backup", "create"]
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      CCTV_DB: /data/cctv.db
      CCTV_BACKUP_DIR: /data/backups
      CCTV_ENV_FILE: /site/.env
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data
      - ./.env:/site/.env:ro

  # Read-only diagnosis (lld/07 §10). Not started with the stack: `./scripts/doctor.sh`
  # runs it on demand. It reaches its siblings over the compose network, so it needs no
  # Docker socket and no privileges on the host.
  doctor:
    <<: *cctv-image
    profiles: ["ops"]
    restart: "no"
    command: ["cctv-doctor"]
    env_file: [.env]
    environment:
      CCTV_CONFIG_DIR: /config
      CCTV_DATA_DIR: /data
      CCTV_DB: /data/cctv.db
      CCTV_ENV_FILE: /site/.env
    volumes:
      - ./config:/config:ro
      - ${CCTV_DATA_DIR:-./data}:/data
      - ./.env:/site/.env:ro

volumes:
  # Gatus's own history. A named volume rather than a host directory because Docker creates a
  # missing bind-mount source as root, which is the ownership trap a fresh install fell into.
  gatus-data:
    {}
