name: Deploy docs

on:
  push:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # mkdocs + mkdocs-material are in the `dev` group, so the same lockfile that
      # pins them for the pre-commit hook pins them here (ADR-0018).
      - name: Install the locked environment
        run: uv sync

      - name: Build site
        run: uv run mkdocs build --strict --site-dir site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # The `github-pages` environment only permits deployments from `master`. Building on
    # every branch is useful, deploying from one is the policy — so a feature branch gets
    # a green build and a skipped deploy instead of a red check it cannot fix.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
