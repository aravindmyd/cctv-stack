# SMB front-end for Frigate's media tree — read-only, one account, no guests.
#
#   recordings   /srv/media — Frigate's recordings/, clips/ (snapshots) and exports/
#
# ⚠️ No trailing comments after a value: Samba treats `#` as a comment only at the
#    START of a line, so `read only = yes   # safe` becomes part of the value.
#    Every comment here is on its own line. `testparm -s` prints the effective
#    config.

[global]
   server string = CCTV recordings
   netbios name = CCTV
   workgroup = WORKGROUP

   # Modern, safe defaults: no SMB1, no anonymous access, no printing, no NetBIOS.
   server min protocol = SMB2_10
   server max protocol = SMB3
   security = user
   passdb backend = tdbsam
   map to guest = never
   restrict anonymous = 2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   usershare max shares = 0

   # One log per client IP. ⚠️ `log level = 2` is deliberate: at the Samba
   # default of 0 a FAILED LOGON is recorded nowhere, which leaves "wrong
   # password" completely undiagnosable. `max log size` caps each file so this
   # cannot fill the disk.
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   log level = 2

[recordings]
   comment = Frigate recordings, snapshots and exports (read-only)
   path = /srv/media
   browseable = yes

   # Two independent reasons this is read-only: `read only = yes` refuses the
   # write at the SMB layer, and the compose mount is `:ro`, so even a Samba bug
   # could not modify or delete footage. This share exists to look at recordings,
   # not to curate them — Frigate owns retention.
   read only = yes

   valid users = cctv
   guest ok = no

   # Frigate runs as root inside its container, so the date directories under
   # recordings/ are root-owned. Serving as root keeps that readable without
   # loosening permissions on 57 GB of footage.
   force user = root

   # macOS Finder and the iOS Files app probe for Apple resource-fork/xattr
   # streams at mount time. Without these two lines the share still mounts but
   # metadata handling behaves oddly; they are the documented macOS fix.
   vfs objects = fruit streams_xattr
   fruit:aapl = yes
