name: Publish

# On every merge to the release branch:
#   * verify the commit
#   * publish a multi-arch image to GHCR as `:edge` and `:sha-<short>`
#   * build a wheel and sdist and keep them as a downloadable workflow artefact
#
# On a `v*` tag, additionally:
#   * publish semver image tags
#   * publish the wheel and sdist to PyPI
#   * attach them to a GitHub Release
#
# PyPI is deliberately not published on every merge: versions are immutable, so the
# second merge with the same version fails. A per-merge pip install is served by the
# workflow artefact (or TestPyPI later); immutable releases go to PyPI.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  image:
    name: image (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cctv-stack
          # `latest` is deliberately absent (ADR-0020): a site always names its version.
          # `edge` is the moving branch build; semver tags are immutable release points.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  dist:
    name: build wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: The lockfile matches pyproject.toml
        run: uv lock --check

      - name: A tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag v{tag} matches pyproject version {version}")
          PY

      - name: Build
        run: uv build

      # Catches a malformed README/metadata before PyPI does, on every merge rather
      # than only when a tag is pushed.
      - name: Check metadata
        run: uvx twine check dist/*

      - name: Fail if the sdist contains a local secret or fixture
        run: |
          set -euo pipefail
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)(\.env|config/cameras\.yml|config/frigate/|data/|dev-synthetic/|spike/)'; then
            echo "refusing to publish: the sdist contains a local-only path" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # PyPI trusted publishing requires a one-time configuration at
  # https://pypi.org/manage/account/publishing/ with:
  #   owner: aravindmyd
  #   repository: cctv-stack
  #   workflow: publish.yml
  #   environment: pypi
  # No API token secret is needed; the job exchanges the GitHub OIDC token.
  pypi:
    name: PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
