name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A release is built from the lockfile that was reviewed, never from a re-resolution.
  UV_FROZEN: "1"

jobs:
  # Fast, dependency-free gate. It runs first so a formatting or whitespace problem
  # fails in seconds instead of after two test suites.
  precommit:
    name: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync

      # Explicit, so the failure names the tool rather than "a hook failed". The
      # pre-commit run below repeats these through the pinned hooks and adds hygiene.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.12. The floor is the container's version, so it is the
        # one that must pass; the next minor is where the next upgrade will come from.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync

      # `tests/integration` is collected and skipped here: its marker is registered, and
      # an endpoint is deliberately not configured. The integration job runs it live.
      - run: uv run pytest

  # pyproject.toml promises that a contributor with only pip can still install the
  # tooling (`pip install -e .[dev]`), and that both paths are exercised in CI because
  # "a fallback that is not tested is a fallback that is broken". This is that path.
  unit-pip:
    name: unit (pip fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest

  integration:
    name: integration (live S3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # boto3 lives in the `storage` extra, not the dev group (ADR-0019).
      - run: uv sync --extra storage

      # run.sh starts RustFS, waits for its health endpoint, exports the test credentials
      # and tears the server down again. It is the same command a developer runs.
      - name: Live S3 integration suite
        run: ./tests/integration/run.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose -f tests/integration/compose.yml logs --tail 100
