site_name: cctv-stack
site_description: A self-hosted CCTV pipeline built on Frigate
repo_url: https://github.com/aravindmyd/cctv-stack
# The published site is built from the default branch, so "edit this page" must point
# there too — a feature-branch link rots the moment it is merged.
edit_uri: edit/master/docs/

# Only user-facing pages belong in `docs/`. The design record (architecture, contracts,
# LLDs, ADRs, PRD) lives in `internal/`, outside `docs_dir`, so it is never built or
# published here — see CONTRIBUTING.md.
nav:
  - Home: index.md
  - Getting started:
    - Install: runbooks/install.md
    - Add or change a camera: runbooks/add-a-camera.md
    - Frigate UI authentication: runbooks/frigate-authentication.md
  - Operating:
    - Recover failed uploads: runbooks/recover-failed-uploads.md
    - Rotate credentials: runbooks/rotate-credentials.md
    - Disaster recovery: runbooks/disaster-recovery.md
    - Clip boundaries: runbooks/clip-boundaries.md
  - Glossary: glossary.md

theme:
  name: material
  palette:
    primary: black
    accent: deep orange
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      permalink_title: Permanent link
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
