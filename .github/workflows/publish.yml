name: Publish

# On every merge to the release branch:
#   * verify the commit
#   * publish a multi-arch image to GHCR as `:edge` and `:sha-<short>`
#   * build a wheel and sdist and keep them as a downloadable workflow artefact
#
# On a `v*` tag, additionally:
#   * publish semver image tags
#   * publish the wheel and sdist to PyPI
#   * assemble the release bundle from an allowlist, verify the built artefact, and sign its
#     checksums with cosign (keyless, over the workflow's OIDC identity)
#   * attach all of it to a GitHub Release
#
# PyPI is deliberately not published on every merge: versions are immutable, so the
# second merge with the same version fails. A per-merge pip install is served by the
# workflow artefact (or TestPyPI later); immutable releases go to PyPI.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  image:
    name: image (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cctv-stack
          # `latest` is deliberately absent (ADR-0020): a site always names its version.
          # `edge` is the moving branch build; semver tags are immutable release points.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  dist:
    name: build wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: The lockfile matches pyproject.toml
        run: uv lock --check

      - name: A tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag v{tag} matches pyproject version {version}")
          PY

      - name: Build
        run: uv build

      # Catches a malformed README/metadata before PyPI does, on every merge rather
      # than only when a tag is pushed.
      - name: Check metadata
        run: uvx twine check dist/*

      - name: Fail if the sdist contains a local secret or fixture
        run: |
          set -euo pipefail
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)(\.env|config/cameras\.yml|config/frigate/|data/|dev-synthetic/|spike/)'; then
            echo "refusing to publish: the sdist contains a local-only path" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # PyPI trusted publishing requires a one-time configuration at
  # https://pypi.org/manage/account/publishing/ with:
  #   owner: aravindmyd
  #   repository: cctv-stack
  #   workflow: publish.yml
  #   environment: pypi
  # No API token secret is needed; the job exchanges the GitHub OIDC token.
  pypi:
    name: PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # The artefact a customer actually receives (packaging.md §2). Assembled from an explicit
  # allowlist rather than `git archive`, then *verified as built* — because the check that
  # matters is on the thing about to be published, not on the code that made it. Signing uses
  # cosign keyless, so there is no private key to steal: the signature is bound to this
  # workflow's identity and the tag that triggered it.
  bundle:
    name: release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write # cosign keyless signing
    env:
      # Bumped together, deliberately: `lld/09` says a Frigate bump changes an external
      # dependency and needs the integration checklist re-run, which is why the version the
      # digests are resolved from is written here rather than read from `stable`.
      FRIGATE_VERSION: "0.18.0"
      FRIGATE_CONTRACT_VERIFIED: "0.18.0"
      MOSQUITTO_IMAGE: "eclipse-mosquitto:2"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Digests, not tags (ADR-0014): a tag can be moved, and the signature covers bytes.
      - name: Resolve the digests this release pins
        id: digests
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]

          def raw(reference: str) -> dict:
              result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", reference, "--raw"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          def per_arch(reference: str) -> dict[str, str]:
              manifest = raw(reference)
              found: dict[str, str] = {}
              for entry in manifest.get("manifests") or []:
                  platform = entry.get("platform") or {}
                  arch = platform.get("architecture")
                  if platform.get("os") == "linux" and arch in {"amd64", "arm64"}:
                      found[arch] = entry["digest"]
              if set(found) != {"amd64", "arm64"}:
                  raise SystemExit(
                      f"{reference} did not resolve both architectures: {sorted(found)}. "
                      "A release pins both, because they are different images."
                  )
              return found

          def index_digest(reference: str) -> str:
              result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", reference],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              for line in result.stdout.splitlines():
                  stripped = line.strip()
                  if stripped.lower().startswith("digest:"):
                      return stripped.split(":", 1)[1].strip()
              raise SystemExit(f"could not read the index digest of {reference}")

          cctv = per_arch(f"ghcr.io/{owner}/cctv-stack:{version}")
          frigate = per_arch(f"ghcr.io/blakeblackshear/frigate:{os.environ['FRIGATE_VERSION']}")
          mosquitto = index_digest(os.environ["MOSQUITTO_IMAGE"])

          lines = {
              "cctv_amd64": f"ghcr.io/{owner}/cctv-stack@{cctv['amd64']}",
              "cctv_arm64": f"ghcr.io/{owner}/cctv-stack@{cctv['arm64']}",
              "frigate_amd64": f"ghcr.io/blakeblackshear/frigate@{frigate['amd64']}",
              "frigate_arm64": f"ghcr.io/blakeblackshear/frigate@{frigate['arm64']}",
              "mosquitto": f"{os.environ['MOSQUITTO_IMAGE'].split(':')[0]}@{mosquitto}",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in lines.items():
                  handle.write(f"{key}={value}\n")
          print("\n".join(f"{k}={v}" for k, v in lines.items()))
          PY

      - name: Assemble the bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          uv run cctv-release bundle \
            --repo . \
            --out dist \
            --version "${RELEASE_VERSION#v}" \
            --frigate-version "$FRIGATE_VERSION" \
            --frigate-contract-verified "$FRIGATE_CONTRACT_VERIFIED" \
            --frigate-amd64 "${{ steps.digests.outputs.frigate_amd64 }}" \
            --frigate-arm64 "${{ steps.digests.outputs.frigate_arm64 }}" \
            --mosquitto "${{ steps.digests.outputs.mosquitto }}" \
            --image-amd64 "${{ steps.digests.outputs.cctv_amd64 }}" \
            --image-arm64 "${{ steps.digests.outputs.cctv_arm64 }}"

      # The allowlist is a statement of intent; this is a statement about what happened.
      - name: Verify the built artefact
        run: |
          set -euo pipefail
          uv run cctv-release inspect "dist/cctv-stack-${GITHUB_REF_NAME#v}.tar.gz"

      - uses: sigstore/cosign-installer@v3

      - name: Sign the checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cctv-stack-bundle
          path: |
            dist/cctv-stack-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cctv-stack-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: cctv-stack-bundle
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
