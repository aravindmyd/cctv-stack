# Camera configuration — the only place cameras are defined.
#
#   cp config/cameras.example.yml config/cameras.yml
#
# Everything Frigate needs is generated from this file:
#
#   cctv-config validate --cameras config/cameras.yml
#   cctv-config generate --cameras config/cameras.yml --out config/frigate/config.yml
#
# `docker compose up` does the second one for you, in the `config` service.
#
# Secrets do not belong in this file. `${VAR}` is substituted from the environment and an
# *unset* variable is a hard error rather than an empty string, so a typo fails at start-up
# instead of producing a camera that silently never connects.

site:
  # Appears in every clip path and, later, in cloud object keys — so it is load-bearing.
  # Lowercase, 1–32 characters: a-z, 0-9 and interior hyphens.
  location: home

  # Never guessed from the host. A container's TZ is easy to get wrong, and wrong here means
  # clips filed under the wrong hour.
  timezone: Asia/Kolkata

# Frigate retains *its own* footage for this long. That window is the clip-worker's recovery
# budget: if the worker is down longer than the shortest window, the footage it needs
# is already gone and no retry can recover it. The generator refuses to emit a shorter one
# without an explicit override.
min_headroom_days: 2

# Settings for Frigate itself, rather than for a camera. They are not part of `defaults`:
# a camera cannot have its own copy of a process-wide setting.
frigate:
  auth:
    # `true` puts the Frigate UI on https://127.0.0.1:8971 behind a login. The password is
    # generated on first start and printed in Frigate's log — see
    # docs/frigate-ui.md before relying on it.
    #
    # If left `false`, the generated config's `auth.enabled: false` is safe ONLY because
    # Frigate's internal port 5000 is never published. Never publish that port.
    enabled: false

  # Which object-detection model runs. Omit this block and Frigate uses the model
  # bundled in its own image (SSD MobileNet v2, 300x300, 91-class COCO) — fine for a
  # first boot, but it is the least accurate option available and it is what most
  # "it thinks a towel is a person" reports turn out to be about.
  #
  # The block below is the recommended configuration for any site with an Intel
  # iGPU. yolov9t is the model Frigate's own docs suggest for the OpenVINO
  # detector, at the 320x320 resolution they recommend: measured at 14 ms per
  # inference on a UHD 630 while servicing 3 cameras at 5 fps.
  #
  # Put the model here first (one-off; see docs/configure.md):
  #   config/frigate/model_cache/yolov9t320/yolov9t.xml  (+ .bin)
  #
  # Supplying `model:` REPLACES Frigate's built-in model configuration rather than
  # merging with it, so every key below is load-bearing:
  #   * `labelmap_path` — wrong here and every detection is named one class early.
  #     This model is the 80-class COCO set, so `coco-80.txt` (index 0 = person).
  #     Frigate's fallback `/labelmap.txt` is also 80-class, which is why getting
  #     this wrong on the *bundled* 91-class model produced detections called
  #     `bicycle` with no error at all.
  #   * `input_tensor` + `input_dtype` — Frigate transposes the frame and divides
  #     by 255 itself when these are set. Omit them and the model is fed uint8
  #     NHWC: it then returns either nothing, or score-1.00 nonsense boxes pinned
  #     to the frame edge.
  #   * `input_pixel_format` — measured on a frame with three known cars: `rgb`
  #     scores them 0.41–0.49, `bgr` scores the same cars 0.28 and invents
  #     `suitcase` detections.
  model:
    path: /config/model_cache/yolov9t320/yolov9t.xml
    model_type: yolo-generic
    width: 320
    height: 320
    input_tensor: nchw
    input_dtype: float
    input_pixel_format: rgb
    labelmap_path: /labelmap/coco-80.txt

# Applies to every camera unless the camera overrides it.
defaults:
  detect:
    objects: [person]
    # Frigate resizes each analysed frame to this. 1280x720 suits a 1080p main stream or a
    # 720p sub-stream; going much higher costs CPU for no detection benefit, because the
    # model itself runs at a fixed small size.
    width: 1280
    height: 720
    fps: 5
    min_score: 0.4

  clip:
    # How much footage either side of the activity the clip includes. Ours alone — Frigate
    # has no equivalent, which is why we cut the range ourselves.
    pre_roll_s: 5
    post_roll_s: 10

    # Frigate's visit threshold: how long a person may be absent before the visit counts as
    # over and the next appearance starts a new clip.
    #
    # Left unset on purpose, so Frigate's own defaults apply (40 s for alerts, 30 s for
    # detections). Set it to take control of the boundary. Measured on real footage: gaps of
    # 25 s and 35 s merge into one clip, gaps of 45 s and 75 s do not.
    # visit_gap_s: 40

    # `alert` is what a person becomes by default. Including `detection` also clips reviews
    # that never rose to an alert.
    severities: [alert, detection]
    objects: [person]

  record:
    # How Frigate retains its own footage, which sets the recovery budget above. Frigate's
    # recordings stay on this host: they are never uploaded and never backed up, so this is
    # disk cost only (ADR-0022).
    # continuous | motion | alerts | detections | off
    #
    # `continuous` is the default: two days of everything, so an incident with no motion —
    # a parcel left at a gate, a quiet corner at night — still has footage. Motion footage is
    # kept seven days, alerts thirty and detections fourteen, on top of that.
    mode: continuous

cameras:
  front-door:
    display_name: Front Door
    enabled: true

    rtsp:
      # Read from .env. See `.env.example` for the matching `CAMERA_FRONT_DOOR_RTSP`.
      main: ${CAMERA_FRONT_DOOR_RTSP}
      # Optional, and worth having: detection on the camera's own sub-stream is far cheaper
      # than decoding the main stream. Without it, detection runs on the main stream and the
      # loader warns, because that cost shows up as CPU load rather than as an error.
      sub: ${CAMERA_FRONT_DOOR_SUB}

  # A second camera needs nothing here but a name and a URL pair. There is no per-camera
  # code anywhere in the stack, and `if camera == "..."` is a change that gets rejected
  # (AGENTS.md §9).
  #
  # gate:
  #   display_name: Side Gate
  #   rtsp:
  #     main: ${CAMERA_GATE_RTSP}
  #     sub: ${CAMERA_GATE_SUB}
